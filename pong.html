<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">

<meta name="viewport"
content="
width=device-width,
initial-scale=1.0,
maximum-scale=1.0,
user-scalable=no">

<title>2808 Pong</title>

<link rel="stylesheet"
href="bandstyle.css">

<style>

/* =========================
   RESET
========================= */

*{

  margin:0;
  padding:0;

  box-sizing:border-box;

  -webkit-tap-highlight-color:
  transparent;
}

/* =========================
   FONT
========================= */

@font-face{

  font-family:'Ghastly';

  src:url(
  'photos/Ghastly_Panic.ttf')
  format('truetype');
}

/* =========================
   BODY
========================= */

body{

  overflow:hidden;

  background:black;

  font-family:
  'Ghastly',
  Arial,
  sans-serif;

  display:flex;

  justify-content:center;

  align-items:center;

  height:100vh;

  touch-action:none;

  user-select:none;
}

/* =========================
   CANVAS
========================= */

canvas{

  border:3px solid #a00000;

  box-shadow:
    0 0 20px red,
    0 0 40px darkred;

  max-width:100vw;
  max-height:100vh;
}

/* =========================
   MENU
========================= */

#menu{

  position:absolute;

  inset:0;

  display:flex;

  flex-direction:column;

  justify-content:center;

  align-items:center;

  z-index:1000;

  background-image:
  url("Pong-Img/cio60076.jpg");

  background-size:cover;

  background-position:center;
}

/* =========================
   TITLE
========================= */

.title{

  font-size:95px;

  color:#a00000;

  margin-bottom:60px;

  letter-spacing:5px;

  text-shadow:
    0 0 10px black,
    0 0 25px red,
    0 0 50px darkred;
}

/* =========================
   BUTTONS
========================= */

.button-wrapper{

  position:relative;

  display:flex;

  justify-content:center;

  align-items:center;

  cursor:pointer;

  margin:15px;

  transition:0.2s;
}

.button-wrapper:hover{

  transform:scale(1.05);
}

.menu-image-btn{

  width:340px;

  pointer-events:none;
}

.button-text{

  position:absolute;

  font-size:52px;

  color:black;

  letter-spacing:3px;

  pointer-events:none;
}

/* =========================
   OVERLAY
========================= */

.overlay{

  position:absolute;

  top:15px;

  width:100%;

  text-align:center;

  color:white;

  pointer-events:none;

  z-index:2;
}

.overlay h1{

  font-size:42px;

  color:#a00000;

  text-shadow:
    0 0 10px black,
    0 0 20px red;
}

.overlay p{

  margin-top:8px;

  font-size:18px;
}

/* =========================
   MOBILE CONTROLS
========================= */

#mobileControls{

  position:absolute;

  inset:0;

  z-index:5;

  pointer-events:none;
}

/* =========================
   DPAD
========================= */

#dpad{

  position:absolute;

  bottom:25px;

  left:50%;

  transform:
  translateX(-50%);

  display:flex;

  align-items:center;

  gap:30px;

  pointer-events:auto;
}

/* =========================
   DPAD BUTTONS
========================= */

.dpad-btn{

  width:130px;
  height:130px;

  border:none;

  cursor:pointer;

  background-size:contain;

  background-repeat:no-repeat;

  background-position:center;

  background-color:transparent;

  touch-action:none;

  transition:0.15s;
}

.dpad-btn:active{

  transform:scale(0.92);
}

/* =========================
   BUTTON IMAGES
========================= */

#upBtn{

  background-image:
  url("Pong-Img/up-arrow.png");
}

#downBtn{

  background-image:
  url("Pong-Img/down-arrow.png");
}

/* =========================
   HOME SHIELD
========================= */

#shield{

  width:100px;
  height:100px;

  border-radius:50%;

  border:3px solid #700000;

  background:
  radial-gradient(
  circle,
  #3a0000,
  #120000);

  display:flex;

  justify-content:center;

  align-items:center;

  box-shadow:
  0 0 20px red;
}

#shield h1{

  color:white;

  font-size:22px;

  text-shadow:
  0 0 10px red;
}

/* =========================
   PAUSE BUTTON
========================= */

#pauseBtn{

  position:absolute;

  top:20px;
  right:20px;

  width:110px;
  height:110px;

  border:none;

  cursor:pointer;

  background-image:
  url("Pong-Img/pause-button.png");

  background-size:contain;

  background-repeat:no-repeat;

  background-position:center;

  background-color:transparent;

  pointer-events:auto;

  touch-action:none;

  transition:0.15s;
}

#pauseBtn:active{

  transform:scale(0.92);
}

/* =========================
   MOBILE
========================= */

@media (max-width:600px){

  canvas{

    width:100vw;
    height:auto;
  }

  .title{

    font-size:55px;
  }

  .menu-image-btn{

    width:250px;
  }

  .button-text{

    font-size:36px;
  }

  .dpad-btn{

    width:95px;
    height:95px;
  }

  #pauseBtn{

    width:75px;
    height:75px;
  }

  #shield{

    width:80px;
    height:80px;
  }
}

</style>
</head>

<body>

<!-- =========================
     MENU
========================= -->

<div id="menu">

  <h1 class="title">
    2808 PONG
  </h1>

  <div class="button-wrapper"
  id="startBtn">

    <img
    src="Texture/Metal-Button.png"
    class="menu-image-btn">

    <span class="button-text">
      START
    </span>

  </div>

  <div class="button-wrapper"
  id="homeBtn">

    <img
    src="Texture/Metal-Button.png"
    class="menu-image-btn">

    <span class="button-text">
      HOME
    </span>

  </div>

</div>

<!-- =========================
     OVERLAY
========================= -->

<div class="overlay">

  <h1>2808 PONG</h1>

  <p>
    W / S TO MOVE —
    ESC FOR MENU
  </p>

</div>

<!-- =========================
     GAME
========================= -->

<canvas
id="game"
width="1000"
height="600"></canvas>

<!-- =========================
     MOBILE CONTROLS
========================= -->

<div id="mobileControls">

  <div id="dpad">

    <button
    class="dpad-btn"
    id="upBtn"></button>

    <a href="index.html">

      <div id="shield">

        <h1>HOME</h1>

      </div>

    </a>

    <button
    class="dpad-btn"
    id="downBtn"></button>

  </div>

  <button id="pauseBtn"></button>

</div>

<script>

// =========================
// GAME SETUP
// =========================

const canvas =
document.getElementById("game");

const ctx =
canvas.getContext("2d");

const menu =
document.getElementById("menu");

const startBtn =
document.getElementById("startBtn");

const homeBtn =
document.getElementById("homeBtn");

let gameStarted = false;

// =========================
// IMAGES
// =========================

const swordImage =
new Image();

swordImage.src =
"Pong-Img/c pong sword.png";

let swordLoaded = false;

swordImage.onload = () => {

  swordLoaded = true;
};

const gameBg =
new Image();

gameBg.src =
"Pong-Img/vecteezy_spooky-old-cellar-abandoned-and-illuminated-with-mysterious_33309983.jpg";

let gameBgLoaded = false;

gameBg.onload = () => {

  gameBgLoaded = true;
};

// =========================
// PLAYER
// =========================

const player = {

  x:20,

  y:canvas.height / 2 - 70,

  width:32,

  height:140,

  speed:8,

  score:0
};

// =========================
// NPC
// =========================

const npc = {

  x:canvas.width - 52,

  y:canvas.height / 2 - 70,

  width:32,

  height:140,

  speed:4.8,

  score:0
};

// =========================
// BALL
// =========================

const ball = {

  x:canvas.width / 2,

  y:canvas.height / 2,

  size:24,

  baseSpeed:4,

  maxSpeed:11,

  currentSpeed:4,

  speedX:4,

  speedY:2
};

// =========================
// CONTROLS
// =========================

const keys = {};

window.addEventListener(
"keydown",

(e) => {

  keys[
  e.key.toLowerCase()
  ] = true;
});

window.addEventListener(
"keyup",

(e) => {

  keys[
  e.key.toLowerCase()
  ] = false;
});

// =========================
// MOBILE BUTTONS
// =========================

const upBtn =
document.getElementById(
"upBtn");

const downBtn =
document.getElementById(
"downBtn");

function holdButton(
button,
key
){

  button.addEventListener(
  "touchstart",

  (e) => {

    e.preventDefault();

    keys[key] = true;
  },

  { passive:false }
  );

  button.addEventListener(
  "touchend",

  () => {

    keys[key] = false;
  });

  button.addEventListener(
  "touchcancel",

  () => {

    keys[key] = false;
  });

  button.addEventListener(
  "mousedown",

  () => {

    keys[key] = true;
  });

  button.addEventListener(
  "mouseup",

  () => {

    keys[key] = false;
  });

  button.addEventListener(
  "mouseleave",

  () => {

    keys[key] = false;
  });
}

holdButton(upBtn,"w");

holdButton(downBtn,"s");

// =========================
// PAUSE BUTTON
// =========================

const pauseBtn =
document.getElementById(
"pauseBtn");

pauseBtn.addEventListener(
"click",

() => {

  gameStarted =
  !gameStarted;

  if(gameStarted){

    menu.style.display =
    "none";

  }

  else{

    menu.style.display =
    "flex";
  }
});

// =========================
// START BUTTON
// =========================

startBtn.addEventListener(
"click",

() => {

  gameStarted = true;

  menu.style.display =
  "none";

  player.score = 0;

  npc.score = 0;

  resetBall();
});

// =========================
// HOME BUTTON
// =========================

homeBtn.addEventListener(
"click",

() => {

  window.location.href =
  "index.html";
});

// =========================
// ESC MENU
// =========================

window.addEventListener(
"keydown",

(e) => {

  if(e.key === "Escape"){

    gameStarted = false;

    menu.style.display =
    "flex";
  }
});

// =========================
// RESET BALL
// =========================

function resetBall(){

  ball.x =
  canvas.width / 2;

  ball.y =
  canvas.height / 2;

  ball.currentSpeed =
  ball.baseSpeed;

  const angle =

  (Math.random()
  * Math.PI / 3)

  -

  (Math.PI / 6);

  const direction =

  Math.random() > 0.5
  ? 1
  : -1;

  ball.speedX =

  Math.cos(angle)

  * ball.currentSpeed

  * direction;

  ball.speedY =

  Math.sin(angle)

  * ball.currentSpeed;
}

// =========================
// MOVE PLAYER
// =========================

function movePlayer(){

  if(keys["w"]){

    player.y -=
    player.speed;
  }

  if(keys["s"]){

    player.y +=
    player.speed;
  }

  player.y = Math.max(

    0,

    Math.min(

      canvas.height
      - player.height,

      player.y
    )
  );
}

// =========================
// MOVE NPC
// =========================

function moveNPC(){

  const center =

  npc.y
  + npc.height / 2;

  if(center < ball.y - 20){

    npc.y += npc.speed;
  }

  else if(
  center > ball.y + 20){

    npc.y -= npc.speed;
  }
}

// =========================
// COLLISION
// =========================

function collision(paddle){

  return(

    ball.x
    - ball.size / 2

    <

    paddle.x
    + paddle.width

    &&

    ball.x
    + ball.size / 2

    >

    paddle.x

    &&

    ball.y
    - ball.size / 2

    <

    paddle.y
    + paddle.height

    &&

    ball.y
    + ball.size / 2

    >

    paddle.y
  );
}

// =========================
// UPDATE
// =========================

function update(){

  movePlayer();

  moveNPC();

  ball.x +=
  ball.speedX;

  ball.y +=
  ball.speedY;

  // =========================
  // WALL COLLISION
  // =========================

  if(

    ball.y
    - ball.size / 2

    <= 0

    ||

    ball.y
    + ball.size / 2

    >= canvas.height

  ){

    ball.speedY *= -1;
  }

  // =========================
  // PLAYER COLLISION
  // =========================

  if(collision(player)){

    // PUSH BALL OUTSIDE
    ball.x =

    player.x
    + player.width
    + ball.size / 2;

    // SPEED UP ON HIT
    if(

      ball.currentSpeed
      < ball.maxSpeed

    ){

      ball.currentSpeed +=
      0.4;
    }

    // ANGLE
    const collidePoint =

    ball.y

    -

    (
      player.y
      + player.height / 2
    );

    const angle =
    collidePoint * 0.02;

    // VELOCITY
    ball.speedX =

    Math.cos(angle)

    * ball.currentSpeed;

    ball.speedY =

    Math.sin(angle)

    * ball.currentSpeed;
  }

  // =========================
  // NPC COLLISION
  // =========================

  if(collision(npc)){

    // PUSH BALL OUTSIDE
    ball.x =

    npc.x
    - ball.size / 2;

    // SPEED UP ON HIT
    if(

      ball.currentSpeed
      < ball.maxSpeed

    ){

      ball.currentSpeed +=
      0.4;
    }

    // ANGLE
    const collidePoint =

    ball.y

    -

    (
      npc.y
      + npc.height / 2
    );

    const angle =
    collidePoint * 0.02;

    // VELOCITY
    ball.speedX =

    -Math.cos(angle)

    * ball.currentSpeed;

    ball.speedY =

    Math.sin(angle)

    * ball.currentSpeed;
  }

  // =========================
  // SCORE
  // =========================

  if(ball.x < 0){

    npc.score++;

    resetBall();
  }

  if(ball.x > canvas.width){

    player.score++;

    resetBall();
  }
}

// =========================
// BACKGROUND
// =========================

function drawBackground(){

  if(gameBgLoaded){

    ctx.drawImage(

      gameBg,

      0,
      0,

      canvas.width,
      canvas.height
    );

  }

  else{

    ctx.fillStyle =
    "#111";

    ctx.fillRect(

      0,
      0,

      canvas.width,
      canvas.height
    );
  }
}

// =========================
// DRAW SWORD
// =========================

function drawSword(

x,
y,

flipped = false
){

  ctx.save();

  const swordWidth = 55;

  const swordHeight = 140;

  if(flipped){

    ctx.translate(

      x + swordWidth,

      y
    );

    ctx.scale(-1,1);

    x = 0;
    y = 0;
  }

  if(swordLoaded){

    ctx.drawImage(

      swordImage,

      x,
      y,

      swordWidth,
      swordHeight
    );

  }

  else{

    ctx.fillStyle =
    "white";

    ctx.fillRect(

      x + 20,

      y,

      12,

      140
    );
  }

  ctx.restore();
}

// =========================
// DRAW BALL
// =========================

function drawBall(){

  ctx.beginPath();

  ctx.arc(

    ball.x,
    ball.y,

    ball.size / 2,

    0,

    Math.PI * 2
  );

  ctx.fillStyle =
  "white";

  ctx.shadowBlur =
  20;

  ctx.shadowColor =
  "white";

  ctx.fill();

  ctx.shadowBlur = 0;
}

// =========================
// CENTER LINE
// =========================

function drawCenterLine(){

  ctx.strokeStyle =
  "rgba(255,0,0,0.25)";

  ctx.lineWidth = 6;

  for(

    let i = 0;

    i < canvas.height;

    i += 40

  ){

    ctx.beginPath();

    ctx.moveTo(

      canvas.width / 2,

      i
    );

    ctx.lineTo(

      canvas.width / 2,

      i + 20
    );

    ctx.stroke();
  }
}

// =========================
// RENDER
// =========================

function render(){

  ctx.clearRect(

    0,
    0,

    canvas.width,
    canvas.height
  );

  drawBackground();

  drawCenterLine();

  drawSword(

    player.x,
    player.y
  );

  drawSword(

    npc.x,
    npc.y,

    true
  );

  drawBall();

  ctx.font =
  "70px Ghastly";

  ctx.fillStyle =
  "#a00000";

  ctx.shadowColor =
  "red";

  ctx.shadowBlur =
  20;

  ctx.fillText(

    player.score,

    canvas.width / 2 - 100,

    80
  );

  ctx.fillText(

    npc.score,

    canvas.width / 2 + 60,

    80
  );

  ctx.shadowBlur = 0;
}

// =========================
// MAIN LOOP
// =========================

function gameLoop(){

  if(gameStarted){

    update();

    render();
  }

  requestAnimationFrame(
  gameLoop);
}

resetBall();

gameLoop();

</script>

</body>
</html>
