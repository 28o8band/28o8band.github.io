<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>2808 Pong</title>

<link rel="stylesheet" href="style.css">

</head>

<body>

<!-- MENU -->

<div id="menu">

  <h1 class="title">
    2808 PONG
  </h1>

  <div class="button-wrapper" id="startBtn">

    <img
      src="Texture/Metal-Button.png"
      class="menu-image-btn"
      draggable="false"
    >

    <span class="button-text">
      START
    </span>

  </div>

  <div class="button-wrapper" id="homeBtn">

    <img
      src="Texture/Metal-Button.png"
      class="menu-image-btn"
      draggable="false"
    >

    <span class="button-text">
      HOME
    </span>

  </div>

</div>

<!-- OVERLAY -->

<div class="overlay">

  <h1>2808 PONG</h1>

  <p>W / S TO MOVE — ESC FOR MENU</p>

</div>

<!-- GAME -->

<canvas id="game"
width="1000"
height="600"></canvas>

<!-- MOBILE CONTROLS -->

<div id="mobileControls">

  <div id="dpad">

    <button
      class="dpad-btn"
      id="upBtn">
    </button>

    <a href="index.html" id="homeMobile">
      HOME
    </a>

    <button
      class="dpad-btn"
      id="downBtn">
    </button>

  </div>

  <button id="pauseBtn"></button>

</div>

<script>

// =========================
// PREVENT IMAGE SAVE / MENU
// =========================

document.addEventListener(
  "contextmenu",
  e => e.preventDefault()
);

document.addEventListener(
  "dragstart",
  e => e.preventDefault()
);

// =========================
// GAME SETUP
// =========================

const canvas =
document.getElementById("game");

const ctx =
canvas.getContext("2d");

const menu =
document.getElementById("menu");

const startBtn =
document.getElementById("startBtn");

const homeBtn =
document.getElementById("homeBtn");

let gameStarted = false;

// =========================
// IMAGES
// =========================

const swordImage = new Image();

swordImage.src =
"Pong-Img/c pong sword.png";

let swordLoaded = false;

swordImage.onload = () => {

  swordLoaded = true;
};

const gameBg = new Image();

gameBg.src =
"Pong-Img/vecteezy_spooky-old-cellar-abandoned-and-illuminated-with-mysterious_33309983.jpg";

let gameBgLoaded = false;

gameBg.onload = () => {

  gameBgLoaded = true;
};

// =========================
// PLAYER
// =========================

const player = {

  x:20,
  y:canvas.height / 2 - 70,
  width:32,
  height:140,
  speed:8,
  score:0
};

// =========================
// NPC
// =========================

const npc = {

  x:canvas.width - 52,
  y:canvas.height / 2 - 70,
  width:32,
  height:140,
  speed:4.8,
  score:0
};

// =========================
// BALL
// =========================

const ball = {

  x:canvas.width / 2,
  y:canvas.height / 2,
  size:24,
  speedX:4,
  speedY:2.5
};

// =========================
// CONTROLS
// =========================

const keys = {};

window.addEventListener(
  "keydown",
  e => {

    keys[e.key.toLowerCase()] = true;
  }
);

window.addEventListener(
  "keyup",
  e => {

    keys[e.key.toLowerCase()] = false;
  }
);

// =========================
// MOBILE BUTTONS
// =========================

const upBtn =
document.getElementById("upBtn");

const downBtn =
document.getElementById("downBtn");

function holdButton(button, key){

  const start = e => {

    e.preventDefault();

    keys[key] = true;
  };

  const end = e => {

    e.preventDefault();

    keys[key] = false;
  };

  button.addEventListener("touchstart", start);

  button.addEventListener("touchend", end);

  button.addEventListener("touchcancel", end);

  button.addEventListener("mousedown", start);

  button.addEventListener("mouseup", end);

  button.addEventListener("mouseleave", end);
}

holdButton(upBtn, "w");

holdButton(downBtn, "s");

// =========================
// PAUSE
// =========================

const pauseBtn =
document.getElementById("pauseBtn");

pauseBtn.addEventListener("click", () => {

  gameStarted = !gameStarted;

  menu.style.display =
    gameStarted ? "none" : "flex";
});

// =========================
// START
// =========================

startBtn.addEventListener("click", () => {

  gameStarted = true;

  menu.style.display = "none";

  player.score = 0;

  npc.score = 0;

  resetBall();
});

// =========================
// HOME
// =========================

homeBtn.addEventListener("click", () => {

  window.location.href =
  "index.html";
});

// =========================
// ESC MENU
// =========================

window.addEventListener(
  "keydown",
  e => {

    if(e.key === "Escape"){

      gameStarted = false;

      menu.style.display = "flex";
    }
  }
);

// =========================
// RESET BALL
// =========================

function resetBall(){

  ball.x = canvas.width / 2;

  ball.y = canvas.height / 2;

  ball.speedX *= -1;

  ball.speedY =
  (Math.random() * 6) - 3;
}

// =========================
// PLAYER MOVE
// =========================

function movePlayer(){

  if(keys["w"])
    player.y -= player.speed;

  if(keys["s"])
    player.y += player.speed;

  player.y = Math.max(
    0,
    Math.min(
      canvas.height - player.height,
      player.y
    )
  );
}

// =========================
// NPC MOVE
// =========================

function moveNPC(){

  const center =
  npc.y + npc.height / 2;

  if(center < ball.y - 20){

    npc.y += npc.speed;
  }

  else if(center > ball.y + 20){

    npc.y -= npc.speed;
  }
}

// =========================
// COLLISION
// =========================

function collision(paddle){

  return(

    ball.x - ball.size / 2 <
    paddle.x + paddle.width &&

    ball.x + ball.size / 2 >
    paddle.x &&

    ball.y - ball.size / 2 <
    paddle.y + paddle.height &&

    ball.y + ball.size / 2 >
    paddle.y
  );
}

// =========================
// UPDATE
// =========================

function update(){

  movePlayer();

  moveNPC();

  ball.x += ball.speedX;

  ball.y += ball.speedY;

  if(
    ball.y - ball.size / 2 <= 0 ||
    ball.y + ball.size / 2 >= canvas.height
  ){

    ball.speedY *= -1;
  }

  if(collision(player)){

    ball.speedX =
    Math.abs(ball.speedX);
  }

  if(collision(npc)){

    ball.speedX =
    -Math.abs(ball.speedX);
  }

  if(ball.x < 0){

    npc.score++;

    resetBall();
  }

  if(ball.x > canvas.width){

    player.score++;

    resetBall();
  }
}

// =========================
// DRAW BACKGROUND
// =========================

function drawBackground(){

  if(gameBgLoaded){

    ctx.drawImage(
      gameBg,
      0,
      0,
      canvas.width,
      canvas.height
    );
  }

  else{

    ctx.fillStyle = "#111";

    ctx.fillRect(
      0,
      0,
      canvas.width,
      canvas.height
    );
  }
}

// =========================
// DRAW SWORDS
// =========================

function drawSword(
  x,
  y,
  flipped = false
){

  ctx.save();

  const swordWidth = 55;

  const swordHeight = 140;

  if(flipped){

    ctx.translate(
      x + swordWidth,
      y
    );

    ctx.scale(-1,1);

    x = 0;

    y = 0;
  }

  if(swordLoaded){

    ctx.drawImage(
      swordImage,
      x,
      y,
      swordWidth,
      swordHeight
    );
  }

  else{

    ctx.fillStyle = "white";

    ctx.fillRect(
      x + 20,
      y,
      12,
      140
    );
  }

  ctx.restore();
}

// =========================
// DRAW BALL
// =========================

function drawBall(){

  ctx.beginPath();

  ctx.arc(
    ball.x,
    ball.y,
    ball.size / 2,
    0,
    Math.PI * 2
  );

  ctx.fillStyle = "white";

  ctx.shadowBlur = 20;

  ctx.shadowColor = "white";

  ctx.fill();

  ctx.shadowBlur = 0;
}

// =========================
// RENDER
// =========================

function render(){

  ctx.clearRect(
    0,
    0,
    canvas.width,
    canvas.height
  );

  drawBackground();

  drawSword(
    player.x,
    player.y
  );

  drawSword(
    npc.x,
    npc.y,
    true
  );

  drawBall();

  ctx.font =
  "70px Ghastly";

  ctx.fillStyle = "#a00000";

  ctx.shadowColor = "red";

  ctx.shadowBlur = 20;

  ctx.fillText(
    player.score,
    canvas.width / 2 - 100,
    80
  );

  ctx.fillText(
    npc.score,
    canvas.width / 2 + 60,
    80
  );

  ctx.shadowBlur = 0;
}

// =========================
// MAIN LOOP
// =========================

function gameLoop(){

  if(gameStarted){

    update();

    render();
  }

  requestAnimationFrame(
    gameLoop
  );
}

gameLoop();

</script>

</body>
</html>
